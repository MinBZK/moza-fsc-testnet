name: lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SHA-pinned marketplace-actions i.p.v. npx/pipx/curl, zodat Scorecard
      # Pinned-Dependencies groen is. Dependabot (github-actions) houdt de pins bij.
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: |
            **/*.md
            #node_modules

      - name: YAML lint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          file_or_dir: .
          config_file: .yamllint.yaml
          strict: true

      - name: Actions lint
        uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1.73.0
        with:
          reporter: local
          filter_mode: nofilter
          fail_on_error: true      # actionlint scant alleen .github/workflows/, dus de bash in composite actions — inclusief het
      # script dat de ZAD-API-key krijgt en de enige harde uitspraak over cleanup doet — viel buiten
      # elke geautomatiseerde toets. shellcheck krijgt die blokken hier alsnog te zien.
      - name: Shellcheck composite-action scripts
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r action; do
            script="$RUNNER_TEMP/$(echo "$action" | tr '/' '-').sh"
            python3 -c 'import sys, yaml; d = yaml.safe_load(open(sys.argv[1])); print("#!/usr/bin/env bash"); [print("# step:", s.get("name", ""), chr(10) + s["run"]) for s in (d.get("runs") or {}).get("steps") or [] if s.get("run")]' "$action" > "$script"
            echo "shellcheck: $action"
            shellcheck --shell=bash --severity=warning "$script" || rc=1
          done < <(find .github/actions -name action.yml)
          shellcheck --shell=bash --severity=warning .github/scripts/*.sh || rc=1
          exit "$rc"

      # De OpenFSC-componenten moeten in lockstep draaien, maar de versie staat op negen plekken
      # (drie wrapper-Dockerfiles, drie workflows, de lokale compose, .env.example én de
      # group-regel `openfsc_min_version`). Dependabot
      # ziet alleen de Dockerfiles, dus zonder deze stap wordt een halve bump gewoon groen — en
      # publiceert de build een image dat de oude versie heet en de nieuwe ís.
      # De regressietest draait eerst: een guard die stil groen blijft is erger dan geen guard, want
      # de comments elders beloven dekking en de handmatige controle is daarmee weggeorganiseerd.
      - name: OpenFSC-versie-guard testen
        run: ./.github/scripts/check-openfsc-version.test.sh

      - name: OpenFSC-versie-consistentie
        run: ./.github/scripts/check-openfsc-version.sh


