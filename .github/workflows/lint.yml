name: lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required check: moet ook op de merge-queue-branch draaien, anders blijft de queue wachten.
  merge_group:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SHA-pinned marketplace-actions i.p.v. npx/pipx/curl, zodat Scorecard
      # Pinned-Dependencies groen is. Dependabot (github-actions) houdt de pins bij.
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            #node_modules

      - name: YAML lint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          file_or_dir: .
          config_file: .yamllint.yaml
          strict: true

      - name: Actions lint
        uses: reviewdog/action-actionlint@48e36f54d8da326b83ab061aee2cc5e01b5ca46f # v1.80.6
        with:
          reporter: local
          filter_mode: nofilter
          fail_on_error: true      # actionlint scant alleen .github/workflows/, dus de bash in composite actions — inclusief het
      # script dat de ZAD-API-key krijgt en de enige harde uitspraak over cleanup doet — viel buiten
      # elke geautomatiseerde toets. shellcheck krijgt die blokken hier alsnog te zien.
      - name: Shellcheck composite-action scripts
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r action; do
            script="$RUNNER_TEMP/$(echo "$action" | tr '/' '-').sh"
            python3 -c 'import sys, yaml; d = yaml.safe_load(open(sys.argv[1])); print("#!/usr/bin/env bash"); [print("# step:", s.get("name", ""), chr(10) + s["run"]) for s in (d.get("runs") or {}).get("steps") or [] if s.get("run")]' "$action" > "$script"
            echo "shellcheck: $action"
            shellcheck --shell=bash --severity=warning "$script" || rc=1
          done < <(find .github/actions -name action.yml)
          shellcheck --shell=bash --severity=warning .github/scripts/*.sh contracts/*.sh \
            deploy/local/smoke-contract.sh || rc=1
          exit "$rc"

      # Idempotentie van de contract-bootstrap, offline; waarom: zie de kop van beide tests.
      - name: Contract-matcher testen
        run: ./contracts/contracten.test.sh

      - name: Contract-bootstrap testen
        run: ./contracts/bootstrap.test.sh

      # De OpenFSC-componenten moeten in lockstep draaien, maar de versie staat op meer plekken dan
      # Dependabot ziet (lijst: docs/openfsc-versiebeheer.md). Zonder deze stap wordt een halve bump
      # gewoon groen.
      # De regressietest draait eerst: een guard die stil groen blijft is erger dan geen guard, want
      # de comments elders beloven dekking en de handmatige controle is daarmee weggeorganiseerd.
      - name: OpenFSC-versie-guard testen
        run: ./.github/scripts/check-openfsc-version.test.sh

      # De guard wijst een halve bump aan, `bump-openfsc.sh` maakt 'm af. Doet dat script stil
      # niets, dan blijft de guard rood zonder dat iets aanwijst waarom, en is handwerk de enige
      # uitweg. Zie docs/openfsc-versiebeheer.md.
      - name: OpenFSC-bumpscript testen
        run: ./.github/scripts/bump-openfsc.test.sh

      # De build- en deploy-workflows taggen op wat dit script uit de Dockerfile leest; een stil
      # verkeerde uitvoer publiceert een image onder de verkeerde versie.
      - name: OpenFSC-tag-uitlezer testen
        run: ./.github/scripts/openfsc-tag.test.sh

      - name: OpenFSC-versie-consistentie
        run: ./.github/scripts/check-openfsc-version.sh


