name: lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required check: moet ook op de merge-queue-branch draaien, anders blijft de queue wachten.
  merge_group:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SHA-pinned marketplace-actions i.p.v. npx/pipx/curl, zodat Scorecard
      # Pinned-Dependencies groen is. Dependabot (github-actions) houdt de pins bij.
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            #node_modules

      - name: YAML lint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          file_or_dir: .
          config_file: .yamllint.yaml
          strict: true

      - name: Actions lint
        uses: reviewdog/action-actionlint@a8ac3eea598697a830f7d8e701fc9fcbfde88974 # v1.80.0
        with:
          reporter: local
          filter_mode: nofilter
          fail_on_error: true      # actionlint scant alleen .github/workflows/, dus de bash in composite actions — inclusief het
      # script dat de ZAD-API-key krijgt en de enige harde uitspraak over cleanup doet — viel buiten
      # elke geautomatiseerde toets. shellcheck krijgt die blokken hier alsnog te zien.
      - name: Shellcheck composite-action scripts
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r action; do
            script="$RUNNER_TEMP/$(echo "$action" | tr '/' '-').sh"
            python3 -c 'import sys, yaml; d = yaml.safe_load(open(sys.argv[1])); print("#!/usr/bin/env bash"); [print("# step:", s.get("name", ""), chr(10) + s["run"]) for s in (d.get("runs") or {}).get("steps") or [] if s.get("run")]' "$action" > "$script"
            echo "shellcheck: $action"
            shellcheck --shell=bash --severity=warning "$script" || rc=1
          done < <(find .github/actions -name action.yml)
          shellcheck --shell=bash --severity=warning .github/scripts/*.sh || rc=1
          shellcheck -x --severity=warning pki/*.sh pki/lib/*.sh || rc=1
          exit "$rc"

      # De OpenFSC-componenten moeten in lockstep draaien, maar de versie staat op negen plekken
      # (drie wrapper-Dockerfiles, drie workflows, de lokale compose, .env.example én de group-regel
      # `openfsc_min_version`). Dependabot ziet alleen de Dockerfiles, dus zonder deze stap wordt
      # een halve bump gewoon groen — en
      # publiceert de build een image dat de oude versie heet en de nieuwe ís.
      # De regressietest draait eerst: een guard die stil groen blijft is erger dan geen guard, want
      # de comments elders beloven dekking en de handmatige controle is daarmee weggeorganiseerd.
      - name: OpenFSC-versie-guard testen
        run: ./.github/scripts/check-openfsc-version.test.sh

      # De guard wijst een halve bump aan, `bump-openfsc.sh` maakt 'm af. Doet dat script stil
      # niets, dan blijft de guard rood zonder dat iets aanwijst waarom, en is handwerk de enige
      # uitweg. Zie docs/openfsc-versiebeheer.md.
      - name: OpenFSC-bumpscript testen
        run: ./.github/scripts/bump-openfsc.test.sh

      - name: OpenFSC-versie-consistentie
        run: ./.github/scripts/check-openfsc-version.sh

      # Zelfde controle als de wekelijkse cert-verloop.yml, met termijn 0: een PR mag geen al
      # verlopen certificaat of CRL in git zetten. De regressietest eerst, om dezelfde reden als hierboven.
      - name: Verloopcontrole testen
        run: ./.github/scripts/check-cert-verloop.test.sh

      - name: Geen verlopen certificaten
        run: ./.github/scripts/check-cert-verloop.sh 0

      # De pki-guards houden een zelfgemaakte CA en een niet-passende sleutel buiten de federatie;
      # de test bouwt daarvoor een echte test-PKI en versleutelt met wegwerpsleutels. Dependabot ziet
      # deze downloads niet: versie en sha256 met de hand bijwerken (cfssl en sops publiceren
      # checksums bij de release, voor age is de hash bij het pinnen berekend).
      - name: PKI-tools installeren
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin" && cd "$RUNNER_TEMP"
          haal() { curl -fsSL --retry 3 -o "$2" "$1" && echo "$3  $2" | sha256sum -c -; }
          haal https://github.com/cloudflare/cfssl/releases/download/v1.6.5/cfssl_1.6.5_linux_amd64 cfssl \
            ff4d3a1387ea3e1ee74f4bb8e5ffe9cbab5bee43c710333c206d14199543ebdf
          haal https://github.com/cloudflare/cfssl/releases/download/v1.6.5/cfssljson_1.6.5_linux_amd64 cfssljson \
            09fbcb7a3b3d6394936ea61eabff1e8a59a8ac3b528deeb14cf66cdbbe9a534f
          haal https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64 sops \
            e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
          haal https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz age.tar.gz \
            cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
          tar -xzf age.tar.gz age/age age/age-keygen
          install -m 755 cfssl cfssljson sops age/age age/age-keygen "$bin/"
          echo "$bin" >> "$GITHUB_PATH"

      - name: PKI-guards testen
        run: ./pki/pki.test.sh


