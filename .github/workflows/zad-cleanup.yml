# ZAD-cleanup via RijksICTGilde/zad-actions/cleanup: verwijdert een deployment uit het
# directory-project (project uit vars.ZAD_PROJECT_ID_DIRECTORY, key uit
# secrets.ZAD_API_KEY_DIRECTORY). Het PR-pad ruimt zichzelf op in zad-deploy-directory.yml;
# deze workflow is voor handmatige gevallen. Een peer-deployment ruim je op bij de app-repo met
# dezelfde action en het eigen project + de eigen key. Zie docs/zad-cleanup.md.
name: zad-cleanup

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: "deployment-naam om op te ruimen (bv. een pr-preview)"
        required: true
      allow_protected:
        description: "sta het verwijderen van beschermde namen (test/main/...) toe"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Eén bron voor de ZAD-API-basis: zowel de zad-actions-call hieronder (api-base-url) als de
  # verificatie-curl wijzen hierop, zodat ze nooit stilzwijgend uiteen kunnen lopen. Zónder
  # /api-suffix: de action-input wil die erbij, de curl bouwt zelf /api/v2/... — elke aanroep
  # plakt 'm apart aan, anders eindig je op /api/api/v2.
  ZAD_API_BASE: https://zad.rijksapp.nl

concurrency:
  # Group-sleutel gedeeld met zad-deploy-directory.yml (project + deployment): een handmatige
  # cleanup van bv. `test` mag niet gelijktijdig lopen met een deploy van `test` vanaf main.
  group: zad-directory-${{ vars.ZAD_PROJECT_ID_DIRECTORY }}-${{ inputs.deployment }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Vangrail uit het verwijderde cleanup.sh: beschermde deployments niet per ongeluk slopen.
      - name: Weiger beschermde deployment-namen
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
          ALLOW_PROTECTED: ${{ inputs.allow_protected }}
        run: |
          set -euo pipefail
          case "$DEPLOYMENT" in
            ""|*[!a-z0-9-]*)
              echo "::error::ongeldige deployment-naam '$DEPLOYMENT' (alleen a-z0-9-)"; exit 1 ;;
          esac
          case "$DEPLOYMENT" in
            test|main|master|production|prod)
              if [ "$ALLOW_PROTECTED" != "true" ]; then
                echo "::error::'$DEPLOYMENT' is beschermd; zet allow_protected aan om te forceren."
                exit 1
              fi
              echo "::warning::beschermde deployment '$DEPLOYMENT' wordt verwijderd (allow_protected)." ;;
          esac

      - name: Cleanup via zad-actions
        id: cleanup
        uses: RijksICTGilde/zad-actions/cleanup@13434cd415db0cd195a2c5f12bf67645acfcb635 # v4.0.6
        with:
          api-key: ${{ secrets.ZAD_API_KEY_DIRECTORY }}
          project-id: ${{ vars.ZAD_PROJECT_ID_DIRECTORY }}
          deployment-name: ${{ inputs.deployment }}
          api-base-url: ${{ env.ZAD_API_BASE }}/api
          delete-github-env: 'false'
          delete-container: 'false'
          # Upstream default (300s) is krap voor een ArgoCD-sync; bij een timeout degradeert de
          # action een mislukte delete tot ::warning:: en gaat groen door — de verificatiestap
          # hieronder ziet dan een deployment die nog volop aan het verdwijnen is.
          task-timeout: '600'

      - name: Waarschuw als de deployment mogelijk nooit bestond
        # --ignore-not-found-achtig gedrag: een typo in de deployment-naam levert hier ook een
        # groene stap op (er was niets te verwijderen). zad-deleted != 'true' is het enige signaal
        # dat onderscheidt "verwijderd" van "nooit bestaan" — meld dat expliciet, want de rest van
        # de job (inclusief de verificatie hieronder) ziet beide gevallen als succes.
        if: steps.cleanup.outputs.zad-deleted != 'true'
        run: |
          echo "::warning::zad-actions meldt zad-deleted='${{ steps.cleanup.outputs.zad-deleted }}' voor '${{ inputs.deployment }}' — de naam bestond mogelijk niet (typo?), of de delete is niet gelukt. Controleer desgewenst de Operations Manager UI."

      - name: Verifieer dat de deployment echt weg is
        # De action rapporteert een mislukte delete als ::warning:: en faalt de step niet (zie
        # zad-common.sh) — zonder harde verificatie hier zou een 401 (bv. na key-rotatie) of 5xx
        # een groene run opleveren terwijl de deployment nog live staat op het productiecluster.
        # Scoped endpoint (GET .../deployments/{deployment}) i.p.v. de lijst: die laatste is
        # cluster-gefilterd ("Returns only deployments targeting the current cluster" — ZAD
        # OpenAPI) en DeploymentListResponse.required is enkel ["project","cluster"], dus
        # `deployments` mag legitiem ontbreken/null zijn — afwezigheid in die lijst bewijst dus
        # niets. De scoped endpoint geeft gewoon 404 (weg) of 2xx (bestaat nog).
        # Een kale 404 is echter GEEN bewijs op zichzelf: live tegen de API geprobeerd, komt
        # diezelfde 404 ook terug op een onbekend pad én op een leeg project-segment — zónder dat
        # de key ooit gecontroleerd wordt. Staat `vars.ZAD_PROJECT_ID_DIRECTORY` ooit leeg/fout, of
        # verandert het endpoint-pad upstream, dan zou deze stap voorheen permanent "opgeruimd"
        # melden terwijl de deployment op het productiecluster blijft draaien. Daarom telt een 404
        # pas als de key/project ook aantoonbaar kloppen: het lijst-endpoint (zonder /{deployment})
        # is authenticated + project-scoped, dus een verkeerde key geeft 401 en een verkeerd
        # project geeft geen 200 — alléén een 200 daar bevestigt dat de 404 hierboven betekent
        # "weg" i.p.v. "onbevoegd/verkeerd pad".
        env:
          ZAD_API_KEY: ${{ secrets.ZAD_API_KEY_DIRECTORY }}
          ZAD_PROJECT: ${{ vars.ZAD_PROJECT_ID_DIRECTORY }}
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          attempts=6
          interval=10
          for attempt in $(seq 1 "$attempts"); do
            # `|| true` (i.p.v. `|| echo "000"`): curl schrijft de -w-uitvoer ('000' bij een
            # connect-/timeout-fout) zelf al naar stdout vóórdat het faalt; een aparte
            # `|| echo "000"` erachter plakte daar een tweede '000' aan vast ("HTTP 000000"), en
            # liet de numerieke vergelijkingen hieronder struikelen op "integer expression
            # expected". De case-normalisatie hierna is het sluitstuk: elke uitkomst die geen
            # drie cijfers is (leeg, of iets onverwachts) wordt hard '000'.
            http_code=$(curl -sS -o /tmp/zad-deployment.json -w '%{http_code}' \
              --connect-timeout 10 --max-time 30 \
              -H "X-API-Key: $ZAD_API_KEY" \
              "$ZAD_API_BASE/api/v2/projects/$ZAD_PROJECT/deployments/$DEPLOYMENT" \
              || true)
            case "$http_code" in
              [0-9][0-9][0-9]) ;;
              *) http_code="000" ;;
            esac

            if [ "$http_code" = "404" ]; then
              list_code=$(curl -sS -o /dev/null -w '%{http_code}' \
                --connect-timeout 10 --max-time 30 \
                -H "X-API-Key: $ZAD_API_KEY" \
                "$ZAD_API_BASE/api/v2/projects/$ZAD_PROJECT/deployments" \
                || true)
              case "$list_code" in
                [0-9][0-9][0-9]) ;;
                *) list_code="000" ;;
              esac

              if [ "$list_code" = "200" ]; then
                echo "Geverifieerd: deployment '$DEPLOYMENT' bestaat niet meer (poging $attempt/$attempts; key/project bevestigd via het lijst-endpoint)."
                exit 0
              fi
              echo "::error::404 op '$DEPLOYMENT', maar het lijst-endpoint gaf HTTP $list_code i.p.v. 200 — key/project kon niet bevestigd worden, dus deze 404 telt niet als bewijs dat de cleanup gelukt is. Controleer ZAD_API_KEY_DIRECTORY/ZAD_PROJECT_ID_DIRECTORY en de Operations Manager UI."
              exit 1
            fi

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              if [ "$attempt" -lt "$attempts" ]; then
                echo "Deployment '$DEPLOYMENT' nog aanwezig (HTTP $http_code, poging $attempt/$attempts) — delete kan nog async lopen, over ${interval}s opnieuw proberen."
                sleep "$interval"
                continue
              fi
              echo "::error::Deployment '$DEPLOYMENT' bestaat nog na cleanup (HTTP $http_code, na $attempts pogingen) — check de Operations Manager UI."
              exit 1
            fi

            # Tijdelijke transport-/serverfouten (connectiefout/timeout = '000', of 5xx) krijgen
            # dezelfde begrensde herhaling als "nog aanwezig": één 502 of een netwerk-hikje mag een
            # verder correcte cleanup niet meteen rood laten uitslaan. Andere statussen (401, 403,
            # overige 4xx, ...) zijn niet transiënt en falen wél meteen, hieronder.
            if [ "$http_code" = "000" ] || { [ "$http_code" -ge 500 ] && [ "$http_code" -lt 600 ]; }; then
              if [ "$attempt" -lt "$attempts" ]; then
                echo "Tijdelijke fout (HTTP $http_code) bij het verifiëren van '$DEPLOYMENT' (poging $attempt/$attempts) — over ${interval}s opnieuw proberen."
                sleep "$interval"
                continue
              fi
              echo "::error::Herhaalde tijdelijke fouten (laatst HTTP $http_code) bij het verifiëren van '$DEPLOYMENT' na $attempts pogingen — cleanup NIET geverifieerd."
              exit 1
            fi

            echo "::error::Onverwachte HTTP-status $http_code bij het ophalen van '$DEPLOYMENT' — cleanup NIET geverifieerd. Check handmatig in de Operations Manager UI of '$DEPLOYMENT' nog bestaat."
            exit 1
          done
