# ZAD-cleanup via RijksICTGilde/zad-actions/cleanup: verwijdert een deployment uit het
# directory-project (project uit vars.ZAD_PROJECT_ID_DIRECTORY, key uit
# secrets.ZAD_API_KEY_DIRECTORY). Het PR-pad ruimt zichzelf op in zad-deploy-directory.yml;
# deze workflow is voor handmatige gevallen. Een peer-deployment ruim je op bij de app-repo met
# dezelfde action en het eigen project + de eigen key. Zie docs/zad-cleanup.md.
name: zad-cleanup

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: "deployment-naam om op te ruimen (bv. een pr-preview)"
        required: true
      allow_protected:
        description: "sta het verwijderen van beschermde namen (test/main/...) toe"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zad-cleanup-${{ inputs.deployment }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      # Vangrail uit het verwijderde cleanup.sh: beschermde deployments niet per ongeluk slopen.
      - name: Weiger beschermde deployment-namen
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
          ALLOW_PROTECTED: ${{ inputs.allow_protected }}
        run: |
          set -euo pipefail
          case "$DEPLOYMENT" in
            ""|*[!a-z0-9-]*)
              echo "::error::ongeldige deployment-naam '$DEPLOYMENT' (alleen a-z0-9-)"; exit 1 ;;
          esac
          case "$DEPLOYMENT" in
            test|main|master|production|prod)
              if [ "$ALLOW_PROTECTED" != "true" ]; then
                echo "::error::'$DEPLOYMENT' is beschermd; zet allow_protected aan om te forceren."
                exit 1
              fi
              echo "::warning::beschermde deployment '$DEPLOYMENT' wordt verwijderd (allow_protected)." ;;
          esac

      - name: Cleanup via zad-actions
        uses: RijksICTGilde/zad-actions/cleanup@13434cd415db0cd195a2c5f12bf67645acfcb635 # v4.0.6
        with:
          api-key: ${{ secrets.ZAD_API_KEY_DIRECTORY }}
          project-id: ${{ vars.ZAD_PROJECT_ID_DIRECTORY }}
          deployment-name: ${{ inputs.deployment }}
          delete-github-env: 'false'
          delete-container: 'false'

      - name: Verifieer dat de deployment echt weg is
        # De action rapporteert een mislukte delete als ::warning:: en faalt de step niet (zie
        # zad-common.sh) — zonder harde verificatie hier zou een 401 (bv. na key-rotatie) of 5xx
        # een groene run opleveren terwijl de deployment nog live staat op het productiecluster.
        env:
          ZAD_API_KEY: ${{ secrets.ZAD_API_KEY_DIRECTORY }}
          ZAD_PROJECT: ${{ vars.ZAD_PROJECT_ID_DIRECTORY }}
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          base="https://zad.rijksapp.nl"
          http_code=$(curl -sS -o /tmp/zad-deployments.json -w '%{http_code}' \
            -H "X-API-Key: $ZAD_API_KEY" \
            "$base/api/v2/projects/$ZAD_PROJECT/deployments")

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Kon deployment-lijst niet ophalen (HTTP $http_code) — cleanup NIET geverifieerd. Check handmatig in de Operations Manager UI of '$DEPLOYMENT' nog bestaat."
            exit 1
          fi
          if ! jq empty /tmp/zad-deployments.json 2>/dev/null; then
            echo "::error::Onverwachte respons (geen geldige JSON) — cleanup NIET geverifieerd. Check handmatig in de Operations Manager UI of '$DEPLOYMENT' nog bestaat."
            exit 1
          fi
          # Vorm eerst afdwingen: zonder deze check maakt `.deployments[]?` van elke onverwachte
          # respons-vorm (schema-wijziging, `{}`, een proxy-foutbody) stilzwijgend "niet aanwezig"
          # — dan meldt deze stap de deployment weg terwijl hij nog kan draaien.
          if ! jq -e '(.deployments | type) == "array"' /tmp/zad-deployments.json >/dev/null 2>&1; then
            echo "::error::Onverwachte respons-vorm (.deployments is geen array) — cleanup NIET geverifieerd. Check handmatig in de Operations Manager UI of '$DEPLOYMENT' nog bestaat."
            exit 1
          fi
          # Géén `?` op .deployments[]: die is hierboven al als array bevestigd, dus een `?` zou
          # hier alleen nog echte jq-fouten (bv. een niet-object element) verbergen. Exit-code apart
          # afhandelen: `jq -e` geeft 0 (gevonden), 1 (niet gevonden) én 5 (jq-fout) — zonder dat
          # onderscheid leest exit 5 als "niet gevonden" en zou een groene run opleveren.
          set +e
          match=$(jq -e --arg d "$DEPLOYMENT" 'any(.deployments[]; .name == $d)' /tmp/zad-deployments.json 2>&1)
          jq_exit=$?
          set -e
          case "$jq_exit" in
            0)
              echo "::error::Deployment '$DEPLOYMENT' bestaat nog na cleanup — check de Operations Manager UI."
              exit 1 ;;
            1)
              echo "Geverifieerd: deployment '$DEPLOYMENT' bestaat niet meer." ;;
            *)
              echo "::error::jq-fout bij verificatie (exit $jq_exit): $match — cleanup NIET geverifieerd. Check handmatig in de Operations Manager UI of '$DEPLOYMENT' nog bestaat."
              exit 1 ;;
          esac
