# Maakt een `openfsc-images`-PR van Dependabot af: draait `bump-openfsc.sh` op de PR-branch en pusht
# het resultaat terug, zodat de versie-guard in `lint` groen wordt. Gepusht wordt met een PAT, want
# een push met GITHUB_TOKEN start geen nieuwe `lint`-run. Zie docs/openfsc-versiebeheer.md en, voor
# het token, docs/sleutelbeheer.md.
name: dependabot-openfsc-bump

on:
  # Bewust `pull_request` en niet `pull_request_target`: deze workflow checkt de PR-branch uit en
  # draait er scripts uit. Onder `pull_request` krijgt een fork-PR geen secrets.
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  bump:
    # `github.actor` en niet alleen de PR-auteur: de push hieronder start een nieuwe run met de
    # PAT-eigenaar als actor, en die moet hier stoppen. Zo komt er ook geen lus en blijft een
    # handmatige push op de branch buiten schot. De branch-check beperkt dit tot de OpenFSC-groep;
    # busybox- en actions-PR's hebben hier niets te zoeken.
    if: >-
      github.actor == 'dependabot[bot]'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'dependabot/docker/')
      && contains(github.head_ref, 'openfsc-images')
    # Op jobniveau en niet op workflowniveau: een run die op de `if` hierboven stopt (zoals die na
    # de eigen push) doet zo niet mee en kan de run die het werk doet niet annuleren. Een nieuwere
    # force-push van Dependabot maakt de lopende run wel overbodig.
    concurrency:
      group: dependabot-openfsc-bump-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Op de exacte head-commit, niet op de standaard merge-ref (`refs/pull/N/merge`): die mag nooit
      # naar de PR-branch. Force-pusht Dependabot intussen, dan weigert GitHub de push als
      # non-fast-forward en maakt de run op die nieuwe commit het af. Zonder opgeslagen credentials:
      # alleen de push-stap krijgt het token te zien.
      - name: Checkout PR-head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Bepaal de nieuwe versie
        id: versie
        run: |
          set -euo pipefail
          # Een branch van vóór deze workflow mist het script; zeg dan wat te doen.
          [ -x .github/scripts/openfsc-tag.sh ] || {
            echo "::error::Deze PR-branch is ouder dan .github/scripts/openfsc-tag.sh; geef '@dependabot recreate' als PR-comment."
            exit 1
          }
          if ./.github/scripts/check-openfsc-version.sh >/dev/null 2>&1; then
            echo "De versies zijn al consistent; niets te doen."
            echo "nodig=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Dependabot groepeert de drie wrappers in één PR, dus ze horen dezelfde tag te dragen.
          # Lopen ze uiteen, dan is er geen eenduidige doelversie en is dit handwerk.
          mapfile -t wrappers < <(find deploy/zad -name Dockerfile | sort)
          nieuw=""
          for wrapper in "${wrappers[@]}"; do
            tag=$(./.github/scripts/openfsc-tag.sh "$wrapper")
            echo "  $wrapper: $tag"
            if [ -z "$nieuw" ]; then
              nieuw="$tag"
            elif [ "$tag" != "$nieuw" ]; then
              echo "::error::De wrapper-Dockerfiles noemen verschillende OpenFSC-versies ($nieuw en $tag); maak deze PR met de hand af."
              exit 1
            fi
          done
          [ -n "$nieuw" ] || { echo "::error::Geen wrapper-Dockerfile gevonden onder deploy/zad."; exit 1; }
          {
            echo "nodig=true"
            echo "nieuw=$nieuw"
          } >> "$GITHUB_OUTPUT"

      # Dependabot volgt alleen de drie wrapper-images. De andere OpenFSC-images krijgen dezelfde tag
      # (de ZAD-deploy draait `directory-ui` erop), en een ontbrekende tag valt daar niet op: de
      # deploy wacht niet tot de pods draaien.
      - name: Controleer dat alle OpenFSC-images de nieuwe tag hebben
        if: steps.versie.outputs.nodig == 'true'
        env:
          NIEUW: ${{ steps.versie.outputs.nieuw }}
        run: |
          set -euo pipefail
          mapfile -t images < <(grep -ohE 'federatedserviceconnectivity/[a-z0-9-]+' \
            deploy/local/docker-compose.yaml deploy/zad/*/Dockerfile | sort -u)
          [ "${#images[@]}" -gt 0 ] || { echo "::error::Geen OpenFSC-images gevonden om te controleren."; exit 1; }
          missing=0
          for image in "${images[@]}"; do
            if docker manifest inspect "docker.io/$image:$NIEUW" >/dev/null; then
              echo "  ok  $image:$NIEUW"
            else
              echo "::error::docker.io/$image:$NIEUW bestaat niet (nog); merge deze bump pas als upstream alle images heeft gepubliceerd."
              missing=1
            fi
          done
          exit "$missing"

      - name: Bump, controleer en commit
        if: steps.versie.outputs.nodig == 'true'
        env:
          NIEUW: ${{ steps.versie.outputs.nieuw }}
        run: |
          set -euo pipefail
          ./.github/scripts/bump-openfsc.sh "$NIEUW"
          ./.github/scripts/check-openfsc-version.sh
          # De PAT mag niet in `.github/workflows/` schrijven, en scripts onder `.github/` horen niet
          # door automatisering te veranderen: faal hier, vóór de push.
          changed=$(git diff --name-only)
          if grep -q '^\.github/' <<<"$changed"; then
            echo "::error::bump-openfsc.sh wijzigde bestanden onder .github/; die mag deze workflow niet pushen."
            echo "$changed"
            exit 1
          fi
          # Committen hier, in een stap zonder token: hooks en git-config in de checkout komen van de
          # PR-branch, en de push-stap draait daarna alleen nog `git push` met hooks uit.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -am \
            "chore(deps): OpenFSC $NIEUW ook in compose, .env.example en group-regel" \
            -m "Dependabot verzet alleen de wrapper-Dockerfiles; de rest via .github/scripts/bump-openfsc.sh $NIEUW."

      # Vóór de push: de run die de push start doet niet mee, maar zo staat de herinnering er ook als
      # de push faalt.
      - name: Samenvatting
        if: steps.versie.outputs.nodig == 'true'
        env:
          NIEUW: ${{ steps.versie.outputs.nieuw }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## OpenFSC $NIEUW afgemaakt

          De compose, \`.env.example\` en de group-regel staan nu ook op $NIEUW. Nog met de hand:

          - Lees de upstream CHANGELOG en diff de required-vlaggen (docs/openfsc-versiebeheer.md, "Bij een versiesprong").
          - Werk de huidige versie bij in README.md en docs/openfsc-versiebeheer.md.
          EOF

      - name: Push naar de PR-branch
        if: steps.versie.outputs.nodig == 'true'
        env:
          TOKEN: ${{ secrets.FBS_DEPENDABOT_PR_SECRET }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          [ -n "$TOKEN" ] || {
            echo "::error::Dependabot-secret FBS_DEPENDABOT_PR_SECRET ontbreekt of is leeg; zie docs/sleutelbeheer.md."
            exit 1
          }
          # Het token alleen als header voor deze ene push, niet in .git/config; hooks uit.
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:refs/heads/$BRANCH" || {
            echo "::error::Push geweigerd. Non-fast-forward: Dependabot pushte intussen, de nieuwe run maakt het af. Anders is FBS_DEPENDABOT_PR_SECRET verlopen of ingetrokken; zie docs/sleutelbeheer.md."
            exit 1
          }
