# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Deze repo bevat geen applicatie-dependencies (config-only), maar wel gepinde artefacten:
# GitHub Actions én de base-image van de manager-migrate-wrapper. Beide staan hieronder. Helm-charts
# worden hier niet gepind (ZAD deployt images, geen charts), dus daar is geen ecosystem voor.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # `monthly`, niet `daily`. Daily liet Dependabot dagelijks kijken en dus bij elke nieuwe
      # upstream-release een open groep-PR force-pushen — en elke force-push is een volle CI-run.
      # Monthly kan omdat "Dependabot security updates" op deze repo AAN staat (ingeschakeld
      # 2026-07-30; controleer met `gh api repos/{owner}/{repo}` →
      # `security_and_analysis.dependabot_security_updates.status`). Advisories leveren daardoor
      # direct een fix-PR op, los van dit interval, dus dit schema hoeft alleen routinematige
      # versiebumps te doen. Zou die instelling ooit weer uitgaan, dan is dit schema het énige
      # automatische kanaal en hoort het terug naar `weekly` (BIO 12.6.1: tijdige maatregelen, niet
      # alleen tijdige detectie) — de workflows hier deployen met een productie-API-key.
      interval: "monthly"
    groups:
      # codeql-action publiceert init/autobuild/analyze/upload-sarif als losse
      # sub-actions onder één versie. Ze MOETEN samen bewegen: een enkele
      # sub-action bumpen geeft een version-skew ("Loaded a configuration file
      # for version X, but running version Y") en breekt de CodeQL-analyse.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Overige actions gebundeld in één PR, minder review-ruis.
      github-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"

  # De wrapper-image draait op odcn-production; zonder dit ecosystem is er geen enkel automatisch
  # signaal bij een CVE in de base-image — en juist dat signaal komt nu via de security-updates
  # binnen (zie de comment bij de actions hierboven).
  - package-ecosystem: "docker"
    directory: "/deploy/zad/manager-migrate"
    schedule:
      interval: "monthly"
