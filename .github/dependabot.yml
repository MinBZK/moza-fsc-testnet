# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Deze repo bevat geen applicatie-dependencies (config-only), maar wel gepinde artefacten:
# GitHub Actions én de base-images van de drie migrate-wrappers. Beide staan hieronder. Helm-charts
# worden hier niet gepind (ZAD deployt images, geen charts), dus daar is geen ecosystem voor.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # `weekly`: het middenpad, en bewust niet `monthly`. Een maandbatch levert één groep-PR op met
      # zoveel bumps dat hij niet meer te reviewen is — en gegroepeerde PR's zijn juist bedoeld om
      # review-ruis te beperken, niet om 'm te verplaatsen. Ook bewust niet `daily`: dan force-pusht
      # Dependabot een open groep-PR bij elke nieuwe upstream-release, en elke force-push is een volle
      # CI-run.
      # Beveiliging hangt niet aan dit interval: "Dependabot security updates" staat op de repo AAN
      # (2026-07-30; `gh api repos/{owner}/{repo}` →
      # `security_and_analysis.dependabot_security_updates.status`), dus een advisory levert direct een
      # fix-PR op. Gaat die instelling ooit uit, dan is dit schema het énige automatische kanaal en mag
      # het in geen geval langer worden (BIO 12.6.1: tijdige maatregelen, niet alleen tijdige detectie)
      # — de workflows hier deployen met een productie-API-key.
      interval: "weekly"
    groups:
      # codeql-action publiceert init/autobuild/analyze/upload-sarif als losse
      # sub-actions onder één versie. Ze MOETEN samen bewegen: een enkele
      # sub-action bumpen geeft een version-skew ("Loaded a configuration file
      # for version X, but running version Y") en breekt de CodeQL-analyse.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Overige actions gebundeld in één PR, minder review-ruis.
      github-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"

  # De wrapper-images draaien op odcn-production; zonder dit ecosystem is er geen enkel automatisch
  # signaal bij een CVE in een base-image — en juist dat signaal komt nu via de security-updates
  # binnen (zie de comment bij de actions hierboven).
  - package-ecosystem: "docker"
    # `directories` (meervoud): één ecosystem-entry over alle drie de wrappers. Met drie losse
    # entries krijgt elke wrapper een eigen PR en kan er één los gemerged worden — precies de
    # versie-skew die hieronder wordt dichtgezet.
    directories:
      - "/deploy/zad/manager-migrate"
      - "/deploy/zad/controller-migrate"
      - "/deploy/zad/txlog-migrate"
    schedule:
      interval: "weekly"
    groups:
      # OpenFSC releaset manager/controller/txlog-api (en inway/outway/directory-ui) in lockstep
      # onder één versietag, en ze MOETEN ook in lockstep draaien: de contract-hash en de
      # grant-vorm zijn versiegebonden, dus een half-gebumpte group praat niet meer met zichzelf.
      # Groeperen over de drie directories geeft één PR die alle drie tegelijk verzet.
      openfsc-images:
        patterns:
          - "*federatedserviceconnectivity/*"
      # De busybox-donor levert alleen /bin/sh aan het distroless base-image en beweegt op zijn
      # eigen tempo; los houden zodat een busybox-CVE niet wacht op een OpenFSC-release.
      busybox:
        patterns:
          - "busybox"
