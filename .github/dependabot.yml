# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Deze repo bevat geen applicatie-dependencies (config-only), maar wel gepinde artefacten:
# GitHub Actions én de base-image van de manager-migrate-wrapper. Beide staan hieronder. Helm-charts
# worden hier niet gepind (ZAD deployt images, geen charts), dus daar is geen ecosystem voor.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # `weekly`, niet `daily` en niet `monthly`. Daily gaf een force-push (= een volle CI-run) bij
      # elke upstream-release van elke gepinde action. Monthly zou goedkoper zijn, maar
      # "Dependabot security updates" staat op deze repo UIT — gemeten via
      # `gh api repos/{owner}/{repo}` → `dependabot_security_updates: disabled`. Het
      # version-updateschema is daarmee het enige automatische kanaal waarlangs een kwetsbare
      # action-pin wordt vervangen, en 30 dagen wachten is niet te verdedigen voor workflows die een
      # productie-API-key aanroepen (BIO 12.6.1). Zet dat repo-instelling aan en `monthly` mag.
      interval: "weekly"
    groups:
      # codeql-action publiceert init/autobuild/analyze/upload-sarif als losse
      # sub-actions onder één versie. Ze MOETEN samen bewegen: een enkele
      # sub-action bumpen geeft een version-skew ("Loaded a configuration file
      # for version X, but running version Y") en breekt de CodeQL-analyse.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Overige actions gebundeld in één PR, minder review-ruis.
      github-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"

  # De wrapper-image draait op odcn-production; zonder dit ecosystem is er geen enkel automatisch
  # signaal bij een CVE in de base-image. (Repo-instelling "Dependabot security updates" staat uit,
  # dus dit schema is ook hier het enige kanaal — zie de comment bij de actions hierboven.)
  - package-ecosystem: "docker"
    directory: "/deploy/zad/manager-migrate"
    schedule:
      interval: "weekly"
